<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Kodograf VVGU</title>
  <desc id="desc">Violet and blue project card with editor tabs and a code cursor</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#111D35"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#334155" opacity=".25"/></pattern>
  </defs>
  <rect width="640" height="260" rx="18" fill="url(#bg)"/><rect width="640" height="260" rx="18" fill="url(#grid)"/>
  <g transform="translate(424 58)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="182" height="142" rx="8" fill="#090D14" stroke="#334155"/>
    <path d="M0 28h182" stroke="#334155"/>
    <rect x="10" y="7" width="58" height="21" rx="4" fill="#1E293B"/><text x="19" y="22" fill="#93C5FD" font-size="11">main.py</text>
    <text x="16" y="58" fill="#C4B5FD" font-size="14">def learn():</text>
    <text x="28" y="84" fill="#93C5FD" font-size="14">run(code)</text>
    <text x="16" y="112" fill="#64748B" font-size="14"># result</text>
    <rect x="99" y="70" width="8" height="18" fill="#60A5FA"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="34" y="42" fill="#94A3B8" font-size="16" letter-spacing="2">LEARN · CODE · RUN</text>
    <text x="34" y="101" fill="#F1F5F9" font-size="35" font-weight="700">КОДОГРАФ</text>
    <text x="36" y="137" fill="#A5B4FC" font-size="18">Python practice in the browser</text>
    <g font-size="15" fill="#F8FAFC">
      <rect x="34" y="166" width="82" height="30" rx="7" fill="#4F46E5"/><text x="49" y="187">NEXT.JS</text>
      <rect x="124" y="166" width="82" height="30" rx="7" fill="#4F46E5"/><text x="137" y="187">MONACO</text>
      <rect x="214" y="166" width="90" height="30" rx="7" fill="#4F46E5"/><text x="227" y="187">PYODIDE</text>
    </g>
  </g>
  <rect x="1" y="1" width="638" height="258" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
</svg>

