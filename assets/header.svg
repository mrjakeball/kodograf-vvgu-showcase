<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Kodograf VVGU</title>
  <desc id="desc">Dark technical banner for an in-browser Python learning environment</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#0f1b2f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" opacity=".34"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="54" y="52" fill="#8B949E" font-size="15" letter-spacing="3">PROJECT DOSSIER · LEARN / RUN / VERIFY</text>
    <text x="54" y="126" fill="#F0F6FC" font-size="46" font-weight="700" letter-spacing="1">КОДОГРАФ ВВГУ</text>
    <text x="57" y="164" fill="#93C5FD" font-size="20">Python practice inside the browser</text>
    <text x="928" y="52" fill="#60A5FA" font-size="15">STATUS / LOCAL VERIFIED</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity=".75">
    <path d="M840 88l-46 42 46 42"/><path d="M1040 88l46 42-46 42"/><path d="M916 184l56-108"/>
  </g>
  <circle cx="972" cy="76" r="5" fill="#8B5CF6"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
